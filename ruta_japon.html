<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Japón · Jaime + Marina · Oct 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,ital,wght@9..144,0,300;9..144,0,400;9..144,0,500;9..144,0,600;9..144,1,300;9..144,1,400&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --paper: #F1E9D6;
    --paper-2: #E8DFC7;
    --ink: #1B1F2A;
    --persimmon: #C84A28;
    --moss: #5E6B3D;
    --border: #C4B99B;
    --border-strong: #A99D80;
    --muted: #6E6858;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: var(--paper);
    color: var(--ink);
    font-size: 14px;
    line-height: 1.55;
  }
  .app {
    display: grid;
    grid-template-columns: 320px 1fr;
    height: 100vh;
  }
  aside {
    background: var(--paper);
    border-right: 1px solid var(--border);
    overflow-y: auto;
    display: flex;
    flex-direction: column;
  }
  aside::-webkit-scrollbar { width: 6px; }
  aside::-webkit-scrollbar-track { background: transparent; }
  aside::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  header.masthead {
    padding: 22px 20px 16px;
    border-bottom: 1px solid var(--border);
  }
  .eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 10px;
  }
  h1 {
    font-family: 'Fraunces', serif;
    font-optical-sizing: auto;
    font-variation-settings: "opsz" 96;
    font-weight: 400;
    font-size: 28px;
    line-height: 1.0;
    letter-spacing: -0.02em;
    color: var(--ink);
    margin-bottom: 10px;
  }
  h1 em {
    font-style: italic;
    color: var(--persimmon);
    font-weight: 300;
  }
  .meta {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--muted);
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .meta span strong { color: var(--ink); font-weight: 500; }
  .countdown {
    margin-top: 4px;
    color: var(--persimmon) !important;
    font-weight: 500;
  }

  .summary {
    padding: 12px 20px;
    border-bottom: 1px solid var(--border);
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 12px;
  }
  .stat-value {
    font-family: 'Fraunces', serif;
    font-size: 20px;
    font-weight: 500;
    line-height: 1;
    color: var(--ink);
    display: block;
  }
  .stat-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    margin-top: 6px;
  }

  .timeline { padding: 4px 0 16px; flex: 1; }
  .section-title {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    padding: 14px 20px 8px;
  }

  .roadmap-section { border-bottom: 1px solid var(--border); padding-bottom: 12px; }
  .roadmap-selector {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    padding: 0 20px 10px;
  }
  .rm-chip {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.02em;
    color: var(--ink);
    background: transparent;
    border: 1px solid var(--border-strong);
    border-radius: 20px;
    padding: 5px 12px;
    cursor: pointer;
    transition: background 0.15s, color 0.15s, border-color 0.15s;
  }
  .rm-chip:hover { border-color: var(--persimmon); color: var(--persimmon); }
  .rm-chip.active {
    background: var(--persimmon);
    border-color: var(--persimmon);
    color: var(--paper);
  }
  .roadmap-card {
    margin: 0 20px;
    background: var(--paper);
    border: 1px solid var(--border);
    border-left: 3px solid var(--persimmon);
    border-radius: 10px;
    padding: 16px 18px;
  }
  .rm-header { margin-bottom: 14px; }
  .rm-title {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 20px;
    color: var(--ink);
    letter-spacing: -0.01em;
  }
  .rm-dates {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    margin-top: 4px;
    letter-spacing: 0.02em;
  }
  .rm-block { margin-top: 16px; }
  .rm-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--persimmon);
    margin-bottom: 6px;
  }
  .rm-label-inline {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .rm-hotel-name {
    font-family: 'Fraunces', serif;
    font-size: 15px;
    color: var(--ink);
  }
  .rm-transport {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 10px;
  }
  .rm-next-hotel {
    font-size: 13px;
    color: var(--ink);
    margin: 10px 0 6px;
  }
  .rm-cta-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .rm-cta-row .info-cta { margin-top: 8px; padding: 8px 14px; font-size: 10px; }
  .roadmap-card .info-todo-title { margin-bottom: 8px; }
  .roadmap-card .info-todo li { font-size: 13px; padding: 8px 0 8px 20px; }
  .rm-next {
    margin-top: 18px;
    padding-top: 14px;
    border-top: 1px dashed var(--border);
  }

  .stop {
    position: relative;
    display: grid;
    grid-template-columns: 32px 1fr auto;
    gap: 10px;
    align-items: start;
    padding: 8px 20px;
    cursor: pointer;
    transition: background 0.15s;
    border-left: 3px solid transparent;
  }
  .stop:hover { background: var(--paper-2); }
  .stop.active {
    background: var(--paper-2);
    border-left-color: var(--persimmon);
  }
  .stop-num {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    padding-top: 2px;
  }
  .stop-body { min-width: 0; }
  .stop-name {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 16px;
    line-height: 1.2;
    color: var(--ink);
    letter-spacing: -0.01em;
  }
  .stop-detail {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    margin-top: 4px;
    letter-spacing: 0.02em;
  }
  .stop-nights {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--ink);
    padding-top: 4px;
    text-align: right;
    white-space: nowrap;
  }
  .stop-nights strong {
    font-family: 'Fraunces', serif;
    font-size: 18px;
    font-weight: 500;
    display: block;
    line-height: 1;
    color: var(--persimmon);
  }
  .stop-nights small {
    font-size: 9px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    margin-top: 4px;
    display: block;
  }

  .leg {
    display: grid;
    grid-template-columns: 32px 1fr auto;
    gap: 10px;
    padding: 4px 20px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 0.02em;
    text-decoration: none;
  }
  a.leg { cursor: pointer; transition: color 0.15s; }
  a.leg:hover { color: var(--persimmon); }
  a.leg:hover .leg-icon { color: var(--persimmon); }
  .leg-icon {
    display: flex;
    justify-content: center;
    align-items: center;
    color: var(--border-strong);
    font-size: 14px;
    line-height: 1;
  }

  .booked {
    display: inline-block;
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    background: var(--moss);
    color: var(--paper);
    padding: 2px 6px;
    border-radius: 2px;
    margin-left: 6px;
    vertical-align: middle;
  }
  .pending {
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--border-strong);
  }
  .partial {
    background: transparent;
    color: var(--persimmon);
    border: 1px solid var(--persimmon);
  }


  .firework-particle {
    position: fixed;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    pointer-events: none;
    z-index: 9999;
    animation: fwBurst 1s ease-out forwards;
  }
  @keyframes fwBurst {
    0% { transform: translate(0, 0) scale(1); opacity: 1; }
    100% { transform: translate(var(--dx), var(--dy)) scale(0.3); opacity: 0; }
  }

  .foot {
    padding: 14px 20px 20px;
    border-top: 1px solid var(--border);
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
  }

  main {
    position: relative;
    background: var(--paper-2);
  }
  #map { width: 100%; height: 100%; }

  .marker-pin {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: var(--persimmon);
    color: var(--paper);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 500;
    font-size: 13px;
    border: 2px solid var(--paper);
    box-shadow: 0 2px 6px rgba(27, 31, 42, 0.35);
    cursor: pointer;
    transition: transform 0.15s;
  }
  .marker-pin:hover { transform: scale(1.15); }
  .marker-pin.active {
    background: var(--ink);
    transform: scale(1.2);
  }
  .marker-pin.optional {
    background: var(--paper);
    color: var(--muted);
    border: 2px dashed var(--border-strong);
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-weight: 400;
    font-size: 15px;
    box-shadow: 0 1px 3px rgba(27, 31, 42, 0.2);
  }
  .marker-pin.optional:hover { border-color: var(--persimmon); color: var(--persimmon); }

  /* Fullscreen info panel */
  .info-overlay {
    position: absolute;
    inset: 0;
    background: rgba(241, 233, 214, 0.96);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    padding: 40px 56px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
    z-index: 500;
    overflow-y: auto;
    display: flex;
    align-items: flex-start;
  }
  .info-overlay.visible { opacity: 1; pointer-events: auto; }
  .info-content { position: relative; max-width: 560px; width: 100%; margin: 0 auto; }
  .info-close {
    position: absolute;
    top: -12px;
    right: -12px;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    border: 1px solid var(--border-strong);
    background: var(--paper);
    color: var(--ink);
    font-size: 18px;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .info-close:hover { background: var(--persimmon); color: var(--paper); border-color: var(--persimmon); }
  .info-cta {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    margin-top: 24px;
    padding: 11px 18px;
    background: var(--ink);
    color: var(--paper);
    text-decoration: none;
    border-radius: 3px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    transition: background 0.15s, transform 0.15s;
  }
  .info-cta:hover { background: var(--persimmon); transform: translateY(-1px); }
  .info-cta::after { content: '↗'; font-size: 13px; }
  .info-cta-row { display: flex; flex-wrap: wrap; gap: 10px; }
  .info-cta-row .info-cta { margin-top: 24px; }
  .info-cta-disabled {
    background: transparent;
    color: var(--muted);
    border: 1px dashed var(--border-strong);
    cursor: default;
  }
  .info-cta-disabled:hover { background: transparent; transform: none; }
  .info-cta-disabled::after { content: none; }
  .info-eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 10px;
  }
  .info-title {
    font-family: 'Fraunces', serif;
    font-optical-sizing: auto;
    font-variation-settings: "opsz" 144;
    font-weight: 400;
    font-size: 40px;
    line-height: 0.95;
    letter-spacing: -0.03em;
    color: var(--ink);
    margin-bottom: 16px;
  }
  .info-title em {
    font-style: italic;
    color: var(--persimmon);
    font-weight: 300;
  }
  .info-dates {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 18px;
    letter-spacing: 0.02em;
    padding-bottom: 18px;
    border-bottom: 1px solid var(--border);
  }
  .info-todo-title {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--persimmon);
    margin-bottom: 12px;
  }
  .info-todo {
    list-style: none;
    padding: 0;
    margin: 0;
  }
  .info-todo li {
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    font-weight: 400;
    color: var(--ink);
    line-height: 1.4;
    padding: 10px 0 10px 22px;
    position: relative;
    border-bottom: 1px dotted var(--border);
  }
  .info-todo li:last-child { border-bottom: none; }
  .info-todo li::before {
    content: '';
    position: absolute;
    left: 4px;
    top: 17px;
    width: 6px;
    height: 6px;
    background: var(--persimmon);
    border-radius: 50%;
  }

  @media (max-width: 900px) {
    /* En móvil no mostramos el mapa (ocupa demasiada pantalla): la lista
       ocupa toda la altura y el mapa queda invisible mismo grid cell.
       El panel de info se saca a position:fixed para que siga
       funcionando a pantalla completa aunque su contenedor (main) esté
       oculto. */
    .app { grid-template-columns: 1fr; grid-template-rows: 1fr; }
    aside { border-right: none; grid-row: 1; grid-column: 1; background: var(--paper-2); }
    main { visibility: hidden; grid-row: 1; grid-column: 1; overflow: hidden; min-width: 0; }
    .info-overlay { visibility: visible; position: fixed; inset: 0; padding: 28px 24px; }
    h1 { font-size: 24px; }
    .info-title { font-size: 32px; }
    .info-todo li { font-size: 14px; }

    /* Lista de paradas como tarjetas, para leer de un vistazo en el móvil */
    .timeline { display: flex; flex-direction: column; gap: 10px; padding: 6px 14px 28px; }
    .section-title { padding: 10px 4px 0; }
    .stop {
      grid-template-columns: 40px 1fr auto;
      gap: 12px;
      background: var(--paper);
      border: 1px solid var(--border);
      border-left: 3px solid transparent;
      border-radius: 14px;
      padding: 14px 14px 14px 12px;
      box-shadow: 0 1px 4px rgba(27, 31, 42, 0.08);
    }
    .stop.active { box-shadow: 0 2px 10px rgba(200, 74, 40, 0.2); }
    .stop-num {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: var(--persimmon);
      color: var(--paper);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 500;
      padding-top: 0;
    }
    .stop.optional .stop-num {
      background: transparent;
      color: var(--muted);
      border: 2px dashed var(--border-strong);
    }
    .stop-name { font-size: 18px; }
    .stop-detail { font-size: 12px; }
    .stop-nights strong { font-size: 22px; }

    /* El trayecto entre tarjetas queda como una línea fina, no una tarjeta */
    .leg { grid-template-columns: 40px 1fr auto; padding: 2px 14px; opacity: 0.8; }
  }
</style>
</head>
<body>


<div class="app">
  <aside>
    <header class="masthead">
      <div class="eyebrow">Itinerario · 15 días</div>
      <h1>Japón <em>en otoño</em></h1>
      <div class="meta">
        <span><strong>Jaime</strong> + <strong>Marina</strong></span>
        <span>03 oct → 17 oct · 2026</span>
        <span>NRT ✈ NRT</span>
        <span id="countdown" class="countdown"></span>
      </div>
    </header>

    <div class="summary">
      <div class="stat">
        <span class="stat-value" id="stat-nights">14</span>
        <div class="stat-label">Noches</div>
      </div>
      <div class="stat">
        <span class="stat-value" id="stat-bases">8</span>
        <div class="stat-label">Paradas</div>
      </div>
      <div class="stat">
        <span class="stat-value" id="stat-booked">1</span>
        <div class="stat-label">Reservado</div>
      </div>
    </div>

    <div class="roadmap-section">
      <div class="section-title">¿Dónde estás?</div>
      <div class="roadmap-selector" id="roadmap-selector"></div>
      <div class="roadmap-card" id="roadmap-card"></div>
    </div>

    <div class="timeline" id="timeline"></div>

    <div class="foot">
      Última revisión · <span id="lastupdate"></span>
    </div>
  </aside>

  <main>
    <div id="map"></div>
    <div class="info-overlay" id="info-overlay">
      <div class="info-content" id="info-content"></div>
    </div>
  </main>
</div>

      address: "3-2-37 Hirooka, Kanazawa, Ishikawa, Japón"
    },
    {

      notes: "Pasa de 1 a 2 noches (sept 2026): Kanazawa desaparece como parada con noche y una de sus 2 noches se traslada aquí. Se llega desde Kanazawa en bus Nohi (~2h15) y se sigue a Narai-juku vía Matsumoto. Posible excursión a Shirakawa-go desde aquí (bus Nohi ~50 min). Las 2 noches están en alojamientos distintos: Ryokan Asunaro (12-13) y Hostel Fish in a River (13-14).",
      todo: [

      ],
      hotel: "Ryokan Asunaro (noche 12-13) + Hostel Fish in a River (noche 13-14)", booked: true,
      bookings: [

        { label: "Reserva noche 13-14", url: "https://www.booking.com/hotel/jp/hostel-fish-in-a-river.es.html", booked: true }
      ],
      address: "2-96-2 Hatsudamachi, Takayama, Gifu, Japón"
    },
    {
      n: 6, name: "Narai-juku", dates: "14 → 15 oct", nights: 1,
      lat: 35.9653, lng: 137.8114,
      notes: "Parada nueva (sept 2026): sustituye a la segunda noche que tenía Kanazawa. Pueblo de posta del antiguo Nakasendo, en el valle de Kiso. Se llega desde Takayama vía bus a Matsumoto (~2h33, reserva obligatoria, verificar si opera en octubre) + tren local a Narai (~30 min). Se sigue a Tokio vía tren local a Shiojiri + Limited Express Azusa (~3h total).",
      todo: [
        "Calle principal de casas de madera del periodo Edo",
        "Templo Chosho-ji"
      ],
      hotel: "Por definir", booked: false
    },
    {
      n: 7, name: "Tokio", dates: "15 → 17 oct", nights: 2,
      lat: 35.7186, lng: 139.7959,
      notes: "Dos últimas noches, zona Asakusa/Ueno para el Skyliner. Vuelo 17 oct 11:10.",
      todo: [
        "Zonas pendientes de Tokio (Ueno, Asakusa, compras)",
        "Cena de despedida (izakaya)",
        "Opción día a Kamakura (~1h en JR)",
        "Skyliner Ueno → Narita ~40 min"
      ],
      hotel: "Por definir · Asakusa/Ueno", booked: false
    }
  ];

  const optionalStops = [
    {
      name: "Nara", label: "Na", tag: "Excursión desde Kioto · planificada",
      lat: 34.6851, lng: 135.8048,
      notes: "Uno de los 4 días de Kioto se dedica a Nara (~45 min en tren). Planificada.",
      todo: [
        "Nara Park (ciervos)",
        "Templo Todai-ji (Gran Buda)",
        "Kasuga Taisha",
        "Isuien Garden"
      ]
    },
    {
      name: "Shirakawa-go", label: "Sh", tag: "Excursión desde Takayama · planificada",
      lat: 36.2578, lng: 136.9066,
      notes: "Pasa a ser excursión de día desde Takayama (sept 2026), en vez de parada con noche. Bus Nohi ~50 min.",
      todo: [
        "Casas gassho-zukuri",
        "Mirador Shiroyama",
        "Casa Wada-ke"
      ]
    },
    {
      name: "Osaka", label: "Os", tag: "Opcional, sin noche",
      lat: 34.6658, lng: 135.5010,
      notes: "Sin noche. Ya no está de paso en la ruta actual (antes se pasaba yendo de Koyasan a Kanazawa; esa ruta ya no existe). Requeriría un desvío deliberado si se quiere ver.",
      todo: [
        "Dotonbori",
        "Castillo de Osaka (si da tiempo)"
      ]
    },
    {
      name: "Kobe", label: "Kb", tag: "Excursión desde Osaka · opcional",
      lat: 34.6901, lng: 135.1955,
      notes: "Opcional. Medio día desde la zona de Osaka (~20-30 min). No reservada.",
      todo: [
        "Barrio de Kitano",
        "Nankinmachi (Chinatown)",
        "Kobe Harborland y puerto",
        "Monte Rokko / cascada Nunobiki",
        "Carne de Kobe"
      ]
    },
    {
      name: "Kamakura", label: "Km", tag: "Excursión desde Tokio · opcional",
      lat: 35.3192, lng: 139.5466,
      notes: "Opcional. Día desde Tokio (~1h en JR). Cabe en cualquiera de los dos bloques de Tokio.",
      todo: [
        "Gran Buda de Kamakura (Kotoku-in)",
        "Templo Hase-dera",
        "Santuario Tsurugaoka Hachimangu",
        "Isla de Enoshima"
      ]
    },
    {
      name: "Miyajima", label: "Mi", tag: "Muy al oeste · opcional",
      lat: 34.2957, lng: 132.3197,
      notes: "Opcional. Isla de Itsukushima, junto a Hiroshima. Muy al oeste (~2h por trayecto): la más exigente, mejor como noche propia si se quiere hacer.",
      todo: [
        "Santuario de Itsukushima (torii flotante)",
        "Monte Misen (teleférico + vistas)",
        "Templo Daisho-in",
        "Ciervos y Momijidani Park"
      ]
    }
  ];

  const legs = [
    { from: 1, to: 2, mode: "Bus Fujikyu desde Shinjuku", time: "1h45" },
    { from: 2, to: 3, mode: "Bus a Mishima + shinkansen", time: "~3h30" },
    { from: 3, to: 4, mode: "Thunderbird a Tsuruga + Hokuriku Shinkansen a Kanazawa", time: "~2h aprox." },
    { from: 4, to: 5, mode: "Bus Nohi", time: "~2h15" },
    { from: 5, to: 6, mode: "Bus Nohi/Alpico a Matsumoto + tren local a Narai", time: "~3h-3h15 aprox." },
    { from: 6, to: 7, mode: "Tren local a Shiojiri + Limited Express Azusa", time: "~3h" }
  ];

function initMap() {

  const map = new google.maps.Map(document.getElementById('map'), {
    center: { lat: 36.2, lng: 137.5 },
    zoom: 6,
    mapId: 'DEMO_MAP_ID',
    zoomControl: true,
    streetViewControl: false,
    mapTypeControl: false,
    fullscreenControl: false
  });

  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);

  // En iPhone, los enlaces https://www.google.com/maps abren primero Safari.
  // Si tienen la app de Google Maps instalada, probamos el esquema
  // comgooglemaps:// (abre la app directamente) y si no reacciona
  // (no está instalada), caemos al enlace web normal.
  function attachSmartMapsClick(el, appUrl, webUrl) {
    if (!isIOS) return;
    el.addEventListener('click', (e) => {
      e.preventDefault();
      let opened = false;
      const onHide = () => { opened = true; };
      document.addEventListener('visibilitychange', onHide, { once: true });
      window.location.href = appUrl;
      setTimeout(() => {
        document.removeEventListener('visibilitychange', onHide);
        if (!opened) window.open(webUrl, '_blank', 'noopener');
      }, 1000);
    });
  }

  function statusBadgeHtml(place) {
    return place.partial
      ? `<span class="booked partial">parcial</span>`
      : place.booked
        ? `<span class="booked">reservado</span>`
        : `<span class="booked pending">pendiente</span>`;
  }

  function bookingButtonsHtml(place) {
    return place.bookings
      ? place.bookings.map(b => b.url
          ? `<a href="${b.url.replace(/&/g, '&amp;')}" target="_blank" rel="noopener" class="info-cta">${b.label}</a>`
          : `<span class="info-cta info-cta-disabled">${b.label}</span>`
        ).join('')
      : (place.bookingUrl
          ? `<a href="${place.bookingUrl.replace(/&/g, '&amp;')}" target="_blank" rel="noopener" class="info-cta">${place.booked ? 'Ver reserva' : 'Ver hotel'}</a>`
          : '');
  }

  const overlay = document.getElementById('info-overlay');
  const overlayContent = document.getElementById('info-content');
  let hideTimer = null;
  let pinned = false;

  function showInfo(place, isOptional, pin) {
    clearTimeout(hideTimer);
    if (pin) pinned = true;
    const statusTag = place.partial ? ' · reserva parcial' : (place.booked ? ' · reservado' : '');
    const eyebrow = isOptional
      ? `Excursión de día`
      : `Parada ${place.n} de ${stops.length}${statusTag}`;
    const meta = isOptional
      ? `${place.tag || 'Excursión de día'}`
      : `${place.dates}  ·  ${place.nights} ${place.nights === 1 ? 'noche' : 'noches'}`;
    const bookingCta = bookingButtonsHtml(place);
    const directionsCta = place.address
      ? `<a href="https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(place.address)}" target="_blank" rel="noopener" class="info-cta" data-directions="1">Cómo llegar</a>`
      : '';
    overlayContent.innerHTML = `
      <button class="info-close" aria-label="Cerrar">×</button>
      <div class="info-eyebrow">${eyebrow}</div>
      <div class="info-title">${place.name}</div>
      <div class="info-dates">${meta}</div>
      <div class="info-todo-title">Qué ver / hacer</div>
      <ul class="info-todo">${place.todo.map(t => `<li>${t}</li>`).join('')}</ul>
      <div class="info-cta-row">${bookingCta}${directionsCta}</div>
    `;
    overlayContent.querySelector('.info-close').addEventListener('click', closeInfo);
    const dirLink = overlayContent.querySelector('[data-directions]');
    if (dirLink) {
      attachSmartMapsClick(
        dirLink,
        `comgooglemaps://?daddr=${encodeURIComponent(place.address)}`,
        dirLink.href
      );
    }
    overlay.classList.add('visible');
  }

  overlay.addEventListener('mouseenter', () => clearTimeout(hideTimer));
  overlay.addEventListener('mouseleave', () => hideInfo(false));
  overlay.addEventListener('click', (e) => { if (e.target === overlay) closeInfo(); });

  function hideInfo(immediate) {
    if (pinned && !immediate) return;
    clearTimeout(hideTimer);
    if (immediate) {
      overlay.classList.remove('visible');
    } else {
      hideTimer = setTimeout(() => overlay.classList.remove('visible'), 220);
    }
  }

  function closeInfo() {
    pinned = false;
    hideInfo(true);
  }

  const markerMap = {};
  const stopEls = {};

  stops.forEach((s, i) => {
    const pinEl = document.createElement('div');
    pinEl.className = 'marker-pin';
    pinEl.dataset.n = s.n;
    pinEl.textContent = s.n;
    const m = new google.maps.marker.AdvancedMarkerElement({
      map, position: { lat: s.lat, lng: s.lng }, content: pinEl
    });
    pinEl.addEventListener('mouseenter', () => showInfo(s, false));
    pinEl.addEventListener('mouseleave', () => hideInfo(false));
    pinEl.addEventListener('click', () => { focusStop(i); showInfo(s, false, true); });
    markerMap[i] = m;
  });

  optionalStops.forEach(o => {
    const pinEl = document.createElement('div');
    pinEl.className = 'marker-pin optional';
    pinEl.textContent = o.label;
    new google.maps.marker.AdvancedMarkerElement({
      map, position: { lat: o.lat, lng: o.lng }, content: pinEl
    });
    pinEl.addEventListener('mouseenter', () => showInfo(o, true));
    pinEl.addEventListener('mouseleave', () => hideInfo(false));
    pinEl.addEventListener('click', () => showInfo(o, true, true));
  });

  const dashSymbol = { path: 'M 0,-1 0,1', strokeOpacity: 1, scale: 3 };
  new google.maps.Polyline({
    path: stops.map(s => ({ lat: s.lat, lng: s.lng })),
    strokeOpacity: 0,
    strokeColor: '#C84A28',
    icons: [{ icon: dashSymbol, offset: '0', repeat: '14px' }],
    map
  });

  const tl = document.getElementById('timeline');
  const legByFrom = {};
  legs.forEach(l => legByFrom[l.from] = l);

  // Selector "¿Dónde estás?" + roadmap extendido de la parada elegida
  const roadmapSelector = document.getElementById('roadmap-selector');
  const roadmapCard = document.getElementById('roadmap-card');

  function renderRoadmap(i) {
    const s = stops[i];
    const next = stops[i + 1];
    const leg = legByFrom[s.n];

    const hotelBlock = `
      <div class="rm-block">
        <div class="rm-label">Alojamiento</div>
        <div class="rm-hotel-name">${s.hotel}</div>
        <div class="rm-cta-row">${bookingButtonsHtml(s)}</div>
      </div>
    `;

    const todoBlock = `
      <div class="rm-block">
        <div class="info-todo-title">Qué ver / hacer</div>
        <ul class="info-todo">${s.todo.map(t => `<li>${t}</li>`).join('')}</ul>
      </div>
    `;

    let nextBlock;
    if (next) {
      const originParam = s.address || `${s.lat},${s.lng}`;
      const destParam = next.address || `${next.lat},${next.lng}`;
      const webUrl = `https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(originParam)}&destination=${encodeURIComponent(destParam)}&travelmode=transit`;
      nextBlock = `
        <div class="rm-block rm-next">
          <div class="rm-label">Preparar para ${next.name}</div>
          ${leg ? `<div class="rm-transport">${leg.mode} · ${leg.time}</div>` : ''}
          <div class="rm-cta-row">
            <a href="${webUrl}" target="_blank" rel="noopener" class="info-cta" data-rm-directions="1">Cómo llegar</a>
          </div>
          <div class="rm-next-hotel">
            <span class="rm-label-inline">Alojamiento en ${next.name}:</span> ${next.hotel} ${statusBadgeHtml(next)}
          </div>
          <div class="rm-cta-row">${bookingButtonsHtml(next)}</div>
        </div>
      `;
    } else {
      nextBlock = `
        <div class="rm-block rm-next">
          <div class="rm-label">Vuelta a casa</div>
          <div class="rm-transport">Vuelo de salida: 17 oct 2026, 11:10 desde Narita (NRT)</div>
        </div>
      `;
    }

    roadmapCard.innerHTML = `
      <div class="rm-header">
        <div class="rm-title">${s.name} ${statusBadgeHtml(s)}</div>
        <div class="rm-dates">${s.dates} · ${s.nights} ${s.nights === 1 ? 'noche' : 'noches'}</div>
      </div>
      ${hotelBlock}
      ${todoBlock}
      ${nextBlock}
    `;

    if (next) {
      const dirLink = roadmapCard.querySelector('[data-rm-directions]');
      if (dirLink) {
        const originParam = s.address || `${s.lat},${s.lng}`;
        const destParam = next.address || `${next.lat},${next.lng}`;
        attachSmartMapsClick(
          dirLink,
          `comgooglemaps://?saddr=${encodeURIComponent(originParam)}&daddr=${encodeURIComponent(destParam)}&directionsmode=transit`,
          dirLink.href
        );
      }
    }

    document.querySelectorAll('.rm-chip').forEach(c => c.classList.remove('active'));
    const chip = document.querySelector(`.rm-chip[data-i="${i}"]`);
    if (chip) chip.classList.add('active');
  }

  stops.forEach((s, i) => {
    const chip = document.createElement('button');
    chip.type = 'button';
    chip.className = 'rm-chip';
    chip.dataset.i = i;
    chip.textContent = `${String(s.n).padStart(2, '0')} ${s.name}`;
    chip.addEventListener('click', () => renderRoadmap(i));
    roadmapSelector.appendChild(chip);
  });

  // Por defecto, selecciona la parada en la que "estás" según la fecha de hoy
  const roadmapTripStart = new Date('2026-10-03T00:00:00+09:00');
  let defaultStopIndex = 0;
  const roadmapNow = new Date();
  if (roadmapNow >= roadmapTripStart) {
    let cursor = new Date(roadmapTripStart);
    for (let idx = 0; idx < stops.length; idx++) {
      defaultStopIndex = idx;
      const endCursor = new Date(cursor);
      endCursor.setDate(endCursor.getDate() + stops[idx].nights);
      if (roadmapNow < endCursor) break;
      cursor = endCursor;
    }
  }
  renderRoadmap(defaultStopIndex);

  const sectionTitle = document.createElement('div');
  sectionTitle.className = 'section-title';
  sectionTitle.textContent = 'Ruta';
  tl.appendChild(sectionTitle);

  stops.forEach((s, i) => {
    const el = document.createElement('div');
    el.className = 'stop';
    el.dataset.i = i;
    const bookedBadge = statusBadgeHtml(s);
    el.innerHTML = `
      <div class="stop-num">${String(s.n).padStart(2, '0')}</div>
      <div class="stop-body">
        <div class="stop-name">${s.name}${bookedBadge}</div>
        <div class="stop-detail">${s.dates}</div>
      </div>
      <div class="stop-nights">
        <strong>${s.nights}</strong>
        <small>${s.nights === 1 ? 'noche' : 'noches'}</small>
      </div>
    `;
    el.addEventListener('click', () => { focusStop(i); showInfo(s, false, true); });
    el.addEventListener('mouseenter', () => showInfo(s, false));
    el.addEventListener('mouseleave', () => hideInfo(false));
    tl.appendChild(el);
    stopEls[i] = el;

    const leg = legByFrom[s.n];
    if (leg) {
      const destStop = stops[i + 1];
      const originParam = s.address || `${s.lat},${s.lng}`;
      const destParam = destStop ? (destStop.address || `${destStop.lat},${destStop.lng}`) : null;
      const legEl = document.createElement(destParam ? 'a' : 'div');
      legEl.className = 'leg';
      if (destParam) {
        legEl.href = `https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(originParam)}&destination=${encodeURIComponent(destParam)}&travelmode=transit`;
        legEl.target = '_blank';
        legEl.rel = 'noopener';
        attachSmartMapsClick(
          legEl,
          `comgooglemaps://?saddr=${encodeURIComponent(originParam)}&daddr=${encodeURIComponent(destParam)}&directionsmode=transit`,
          legEl.href
        );
      }
      legEl.innerHTML = `
        <div class="leg-icon">↓</div>
        <div>${leg.mode}</div>
        <div>${leg.time}</div>
      `;
      tl.appendChild(legEl);
    }
  });

  // Optional stops section
  const optSection = document.createElement('div');
  optSection.className = 'section-title';
  optSection.textContent = 'Excursiones de día';
  optSection.style.marginTop = '20px';
  tl.appendChild(optSection);

  optionalStops.forEach(o => {
    const el = document.createElement('div');
    el.className = 'stop optional';
    el.style.opacity = '0.75';
    el.innerHTML = `
      <div class="stop-num" style="font-style:italic">${o.label}</div>
      <div class="stop-body">
        <div class="stop-name" style="font-style:italic">${o.name}</div>
        <div class="stop-detail">${o.tag || 'Excursión de día'}</div>
      </div>
      <div class="stop-nights">
        <strong style="color:var(--muted);font-style:italic">?</strong>
      </div>
    `;
    el.addEventListener('click', () => showInfo(o, true, true));
    el.addEventListener('mouseenter', () => showInfo(o, true));
    el.addEventListener('mouseleave', () => hideInfo(false));
    tl.appendChild(el);
  });

  let currentIndex = 0;

  function focusStop(i) {
    currentIndex = i;
    Object.values(stopEls).forEach(el => el.classList.remove('active'));
    stopEls[i].classList.add('active');
    document.querySelectorAll('.marker-pin').forEach(el => el.classList.remove('active'));
    const s = stops[i];
    map.panTo({ lat: s.lat, lng: s.lng });
    map.setZoom(10);
    setTimeout(() => {
      const pin = document.querySelector(`.marker-pin[data-n="${s.n}"]`);
      if (pin) pin.classList.add('active');
    }, 100);
    stopEls[i].scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
      e.preventDefault();
      focusStop(Math.min(currentIndex + 1, stops.length - 1));
    } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
      e.preventDefault();
      focusStop(Math.max(currentIndex - 1, 0));
    } else if (e.key === 'Escape') {
      closeInfo();
    }
    checkKonami(e.key);
  });

  // Easter egg: código Konami → fuegos artificiales (hanabi)
  const konamiCode = ['ArrowUp', 'ArrowUp', 'ArrowDown', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'ArrowLeft', 'ArrowRight', 'b', 'a'];
  let konamiIndex = 0;
  function checkKonami(key) {
    const expected = konamiCode[konamiIndex];
    const match = expected.length === 1 ? key.toLowerCase() === expected : key === expected;
    if (match) {
      konamiIndex++;
      if (konamiIndex === konamiCode.length) {
        konamiIndex = 0;
        triggerFireworks();
      }
    } else {
      konamiIndex = (key === konamiCode[0]) ? 1 : 0;
    }
  }

  function spawnFirework(x, y) {
    const colors = ['#C84A28', '#5E6B3D', '#1B1F2A', '#D4AF37'];
    for (let i = 0; i < 24; i++) {
      const p = document.createElement('div');
      p.className = 'firework-particle';
      const angle = (i / 24) * 2 * Math.PI;
      const dist = 60 + Math.random() * 80;
      p.style.left = x + 'px';
      p.style.top = y + 'px';
      p.style.background = colors[Math.floor(Math.random() * colors.length)];
      p.style.setProperty('--dx', Math.cos(angle) * dist + 'px');
      p.style.setProperty('--dy', Math.sin(angle) * dist + 'px');
      document.body.appendChild(p);
      setTimeout(() => p.remove(), 1000);
    }
  }

  function triggerFireworks() {
    for (let b = 0; b < 4; b++) {
      setTimeout(() => {
        const x = 100 + Math.random() * (window.innerWidth - 200);
        const y = 100 + Math.random() * (window.innerHeight * 0.5);
        spawnFirework(x, y);
      }, b * 300);
    }
  }

  document.getElementById('lastupdate').textContent = new Date().toLocaleDateString('es-ES', { day: '2-digit', month: 'short', year: 'numeric' }).toLowerCase();
  document.getElementById('stat-booked').textContent = stops.filter(s => s.booked).length;
  document.getElementById('stat-bases').textContent = stops.length;
  document.getElementById('stat-nights').textContent = stops.reduce((a, s) => a + s.nights, 0);

  // Cuenta atrás hasta el viaje
  const tripStart = new Date('2026-10-03T00:00:00+09:00');
  const tripEnd = new Date('2026-10-17T23:59:59+09:00');
  const now = new Date();
  const countdownEl = document.getElementById('countdown');
  if (now < tripStart) {
    const days = Math.ceil((tripStart - now) / 86400000);
    countdownEl.textContent = `Faltan ${days} días`;
  } else if (now <= tripEnd) {
    const dayNum = Math.floor((now - tripStart) / 86400000) + 1;
    countdownEl.textContent = `Día ${dayNum} de 15 · ¡en Japón!`;
  } else {
    countdownEl.textContent = `Viaje completado`;
  }

}
</script>
