<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Japón · Jaime + Marina · Oct 2026</title>
<link rel="icon" href="icon-japan-180.png" />
<link rel="apple-touch-icon" href="icon-japan-180.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Japón" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,ital,wght@9..144,0,300;9..144,0,400;9..144,0,500;9..144,0,600;9..144,1,300;9..144,1,400&family=Playfair+Display:ital,wght@0,600;1,400&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --paper: #F1E9D6;
    --paper-2: #E8DFC7;
    --ink: #1B1F2A;
    --persimmon: #C84A28;
    --moss: #5E6B3D;
    --border: #C4B99B;
    --border-strong: #A99D80;
    --muted: #6E6858;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: var(--paper);
    color: var(--ink);
    font-size: 14px;
    line-height: 1.55;
  }
  .app {
    display: grid;
    grid-template-columns: 320px 1fr;
    height: 100vh;
  }
  aside {
    background: var(--paper);
    border-right: 1px solid var(--border);
    overflow-y: auto;
    display: flex;
    flex-direction: column;
  }
  aside::-webkit-scrollbar { width: 6px; }
  aside::-webkit-scrollbar-track { background: transparent; }
  aside::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  header.masthead {
    padding: 22px 20px 16px;
    border-bottom: 1px solid var(--border);
  }
  .eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 10px;
  }
  h1 {
    font-family: 'Playfair Display', serif;
    font-weight: 600;
    font-size: 44px;
    line-height: 1.0;
    letter-spacing: -0.02em;
    color: var(--ink);
    margin-bottom: 10px;
  }
  h1 em {
    font-style: italic;
    color: var(--persimmon);
    font-weight: 400;
  }
  .meta {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--muted);
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .meta span strong { color: var(--ink); font-weight: 500; }
  .countdown {
    margin-top: 4px;
    color: var(--persimmon) !important;
    font-weight: 500;
  }

  .summary {
    padding: 12px 20px;
    border-bottom: 1px solid var(--border);
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 12px;
  }
  .stat-value {
    font-family: 'Fraunces', serif;
    font-size: 20px;
    font-weight: 500;
    line-height: 1;
    color: var(--ink);
    display: block;
  }
  .stat-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    margin-top: 6px;
  }

  .converter-btn {
    display: flex;
    align-items: center;
    gap: 10px;
    width: calc(100% - 40px);
    margin: 12px 20px 0;
    padding: 10px 14px;
    background: var(--paper-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 500;
    color: var(--ink);
    text-align: left;
    text-decoration: none;
    transition: background 0.15s;
  }
  .converter-btn:hover { background: var(--border); }
  .converter-btn-icon {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    font-weight: 500;
    color: var(--paper);
    background: var(--moss);
    padding: 4px 7px;
    border-radius: 6px;
    flex: 0 0 auto;
  }
  .converter-fields {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    gap: 8px;
    align-items: center;
  }
  .converter-field { display: flex; flex-direction: column; gap: 4px; }
  .converter-field label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--muted);
  }
  .converter-field input {
    font-family: 'Fraunces', serif;
    font-size: 17px;
    font-weight: 500;
    color: var(--ink);
    background: var(--paper-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 7px 9px;
    width: 100%;
    min-width: 0;
  }
  .converter-field input:focus { outline: none; border-color: var(--persimmon); }
  .converter-swap {
    font-size: 14px;
    color: var(--muted);
    padding-top: 14px;
  }
  .converter-rate {
    margin-top: 8px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }
  .converter-rate #conv-rate {
    font-weight: 500;
    color: var(--ink);
  }
  .converter-status {
    margin-top: 6px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--muted);
  }

  .timeline { padding: 4px 0 16px; flex: 1; }
  .section-title {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    padding: 14px 20px 8px;
  }

  /* Bloque "preparar para el siguiente destino" dentro del panel grande */
  .rm-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--persimmon);
    margin-bottom: 6px;
  }
  .rm-label-inline {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .rm-transport {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 4px;
  }
  .rm-next-hotel {
    font-size: 14px;
    color: var(--ink);
    margin: 14px 0 4px;
  }
  .rm-next {
    margin-top: 28px;
    padding-top: 20px;
    border-top: 1px dashed var(--border);
  }
  .rm-steps { list-style: none; margin: 10px 0; padding: 0; }
  .rm-step {
    display: flex;
    align-items: baseline;
    gap: 8px;
    font-size: 13px;
    color: var(--ink);
    padding: 5px 0;
    border-bottom: 1px dotted var(--border);
  }
  .rm-step:last-child { border-bottom: none; }
  .rm-step-icon { flex: 0 0 auto; }
  .rm-step-desc { flex: 1 1 auto; }
  .rm-step-time {
    flex: 0 0 auto;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    white-space: nowrap;
  }
  .rm-step-meta {
    display: block;
    margin-top: 2px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--muted);
  }
  .rm-alt {
    font-size: 12px;
    color: var(--muted);
    background: var(--paper-2);
    border-radius: 6px;
    padding: 8px 10px;
    margin: 6px 0 4px;
  }
  .rm-collapsible { margin-top: 2px; }
  .rm-toggle-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin: 2px 0 10px;
    padding: 5px 10px;
    background: transparent;
    border: 1px solid var(--border-strong);
    border-radius: 3px;
    color: var(--muted);
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.06em;
    cursor: pointer;
    transition: border-color 0.15s, color 0.15s;
  }
  .rm-toggle-btn:hover { border-color: var(--persimmon); color: var(--persimmon); }
  .rm-toggle-btn::before {
    content: '▸';
    display: inline-block;
    transition: transform 0.15s ease;
  }
  .rm-option { margin: 0 0 16px; padding-bottom: 14px; border-bottom: 1px dashed var(--border); }
  .rm-option:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
  .rm-option-head {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 6px;
  }
  .rm-option-icon { font-size: 15px; }
  .rm-option-title { font-weight: 500; color: var(--ink); font-size: 13px; }
  .rm-option-time {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    margin-left: auto;
    white-space: nowrap;
  }
  .rm-fastest-badge {
    display: inline-block;
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    background: var(--moss);
    color: var(--paper);
    padding: 2px 7px;
    border-radius: 2px;
  }
  .rm-option-desc { font-size: 13px; color: var(--ink); }
  .rm-option-price {
    margin-top: 4px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--muted);
  }
  .rm-option-note {
    font-size: 12px;
    color: var(--muted);
    background: var(--paper-2);
    border-radius: 6px;
    padding: 6px 9px;
    margin-top: 6px;
  }
  .line-badge {
    display: inline-flex;
    align-items: center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    font-weight: 500;
    color: #fff;
    padding: 1px 5px;
    border-radius: 3px;
    white-space: nowrap;
  }
  .rm-toggle-btn[aria-expanded="true"]::before { transform: rotate(90deg); }
  .rm-tabs { display: flex; flex-direction: column; gap: 8px; margin: 20px 0 18px; }
  .rm-tab-btn {
    width: 100%;
    text-align: left;
    padding: 8px 14px;
    border-radius: 3px;
    border: 1px solid var(--border-strong);
    background: transparent;
    color: var(--muted);
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.06em;
    cursor: pointer;
    transition: background 0.15s, color 0.15s, border-color 0.15s;
  }
  .rm-tab-btn:hover { border-color: var(--persimmon); color: var(--persimmon); }
  .rm-tab-btn.active { background: var(--ink); border-color: var(--ink); color: var(--paper); }
  .stop-today {
    display: inline-block;
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    background: var(--persimmon);
    color: var(--paper);
    padding: 2px 6px;
    border-radius: 2px;
    margin-left: 6px;
    vertical-align: middle;
  }

  .stop {
    position: relative;
    display: grid;
    grid-template-columns: 32px 1fr auto;
    gap: 10px;
    align-items: start;
    padding: 8px 20px;
    cursor: pointer;
    transition: background 0.15s;
    border-left: 3px solid transparent;
  }
  .stop:hover { background: var(--paper-2); }
  .stop.active {
    background: var(--paper-2);
    border-left-color: var(--persimmon);
  }
  .stop-num {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    padding-top: 2px;
  }
  .stop-body { min-width: 0; }
  .stop-name {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 16px;
    line-height: 1.2;
    color: var(--ink);
    letter-spacing: -0.01em;
  }
  .stop-detail {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    margin-top: 4px;
    letter-spacing: 0.02em;
  }
  .stop-nights {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--ink);
    padding-top: 4px;
    text-align: right;
    white-space: nowrap;
  }
  .stop-nights strong {
    font-family: 'Fraunces', serif;
    font-size: 18px;
    font-weight: 500;
    display: block;
    line-height: 1;
    color: var(--persimmon);
  }
  .stop-nights small {
    font-size: 9px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    margin-top: 4px;
    display: block;
  }

  .booked {
    display: inline-block;
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    background: var(--moss);
    color: var(--paper);
    padding: 2px 6px;
    border-radius: 2px;
    margin-left: 6px;
    vertical-align: middle;
  }
  .pending {
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--border-strong);
  }
  .partial {
    background: transparent;
    color: var(--persimmon);
    border: 1px solid var(--persimmon);
  }


  .firework-particle {
    position: fixed;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    pointer-events: none;
    z-index: 9999;
    animation: fwBurst 1s ease-out forwards;
  }
  @keyframes fwBurst {
    0% { transform: translate(0, 0) scale(1); opacity: 1; }
    100% { transform: translate(var(--dx), var(--dy)) scale(0.3); opacity: 0; }
  }

  .foot {
    padding: 14px 20px 20px;
    border-top: 1px solid var(--border);
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
  }

  main {
    position: relative;
    background: var(--paper-2);
  }
  #map { width: 100%; height: 100%; }

  .marker-pin {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: var(--persimmon);
    color: var(--paper);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 500;
    font-size: 13px;
    border: 2px solid var(--paper);
    box-shadow: 0 2px 6px rgba(27, 31, 42, 0.35);
    cursor: pointer;
    transition: transform 0.15s;
  }
  .marker-pin:hover { transform: scale(1.15); }
  .marker-pin.active {
    background: var(--ink);
    transform: scale(1.2);
  }
  .marker-pin.optional {
    background: var(--paper);
    color: var(--muted);
    border: 2px dashed var(--border-strong);
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-weight: 400;
    font-size: 15px;
    box-shadow: 0 1px 3px rgba(27, 31, 42, 0.2);
  }
  .marker-pin.optional:hover { border-color: var(--persimmon); color: var(--persimmon); }

  /* Fullscreen info panel */
  .info-overlay {
    position: absolute;
    inset: 0;
    background: rgba(241, 233, 214, 0.96);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    padding: 40px 56px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
    z-index: 500;
    overflow-y: auto;
    display: flex;
    align-items: flex-start;
  }
  .info-overlay.visible { opacity: 1; pointer-events: auto; }
  .info-content { position: relative; max-width: 560px; width: 100%; margin: 0 auto; }
  .info-close {
    position: absolute;
    top: -12px;
    right: -12px;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    border: 1px solid var(--border-strong);
    background: var(--paper);
    color: var(--ink);
    font-size: 18px;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .info-close:hover { background: var(--persimmon); color: var(--paper); border-color: var(--persimmon); }
  .info-cta {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin: 10px 0 0;
    padding: 5px 10px;
    background: var(--ink);
    color: var(--paper);
    text-decoration: none;
    border-radius: 3px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.06em;
    transition: background 0.15s, transform 0.15s;
  }
  .info-cta:hover { background: var(--persimmon); transform: translateY(-1px); }
  .info-cta::after { content: '↗'; font-size: 13px; }
  .info-cta-row { display: flex; flex-wrap: wrap; gap: 10px; }
  .info-cta-row .info-cta { margin-top: 10px; }
  .rm-btn-row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
  .rm-btn-row .info-cta, .rm-btn-row .rm-toggle-btn { margin: 2px 0 10px; }
  .info-cta-disabled {
    background: transparent;
    color: var(--muted);
    border: 1px dashed var(--border-strong);
    cursor: default;
  }
  .info-cta-disabled:hover { background: transparent; transform: none; }
  .info-cta-disabled::after { content: none; }
  .info-eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 10px;
  }
  .info-title {
    font-family: 'Fraunces', serif;
    font-optical-sizing: auto;
    font-variation-settings: "opsz" 144;
    font-weight: 400;
    font-size: 40px;
    line-height: 0.95;
    letter-spacing: -0.03em;
    color: var(--ink);
    margin-bottom: 16px;
  }
  .info-title em {
    font-style: italic;
    color: var(--persimmon);
    font-weight: 300;
  }
  .info-dates {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 18px;
    letter-spacing: 0.02em;
    padding-bottom: 18px;
    border-bottom: 1px solid var(--border);
  }
  .info-todo-title {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--persimmon);
    margin-bottom: 12px;
  }
  .info-todo {
    list-style: none;
    padding: 0;
    margin: 0;
  }
  .info-todo li {
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    font-weight: 400;
    color: var(--ink);
    line-height: 1.4;
    padding: 10px 0 10px 22px;
    position: relative;
    border-bottom: 1px dotted var(--border);
  }
  .info-todo li:last-child { border-bottom: none; }
  .info-todo li::before {
    content: '';
    position: absolute;
    left: 4px;
    top: 17px;
    width: 6px;
    height: 6px;
    background: var(--persimmon);
    border-radius: 50%;
  }

  @media (max-width: 900px) {
    /* En móvil no mostramos el mapa (ocupa demasiada pantalla): la lista
       ocupa toda la altura y el mapa queda invisible mismo grid cell.
       El panel de info se saca a position:fixed para que siga
       funcionando a pantalla completa aunque su contenedor (main) esté
       oculto. */
    .app { grid-template-columns: 1fr; grid-template-rows: 1fr; }
    aside { border-right: none; grid-row: 1; grid-column: 1; background: var(--paper-2); }
    main { visibility: hidden; grid-row: 1; grid-column: 1; overflow: hidden; min-width: 0; }
    .info-overlay { visibility: visible; position: fixed; inset: 0; padding: 28px 24px; }
    h1 { font-size: 38px; }
    .info-title { font-size: 32px; }
    .info-todo li { font-size: 14px; }
    .rm-tabs { display: grid; grid-template-columns: max-content; }
    .rm-tab-btn { width: auto; font-size: 13px; padding: 9px 16px; }

    /* Lista de paradas como tarjetas, para leer de un vistazo en el móvil */
    .timeline { display: flex; flex-direction: column; gap: 10px; padding: 6px 14px 28px; }
    .section-title { padding: 10px 4px 0; }
    .stop {
      grid-template-columns: 40px 1fr auto;
      gap: 12px;
      background: var(--paper);
      border: 1px solid var(--border);
      border-left: 3px solid transparent;
      border-radius: 14px;
      padding: 14px 14px 14px 12px;
      box-shadow: 0 1px 4px rgba(27, 31, 42, 0.08);
    }
    .stop.active { box-shadow: 0 2px 10px rgba(200, 74, 40, 0.2); }
    .stop-num {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: var(--persimmon);
      color: var(--paper);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 500;
      padding-top: 0;
    }
    .stop.optional .stop-num {
      background: transparent;
      color: var(--muted);
      border: 2px dashed var(--border-strong);
    }
    .stop-name { font-size: 18px; }
    .stop-detail { font-size: 12px; }
    .stop-nights strong { font-size: 22px; }
  }
</style>
</head>
<body>


<div class="app">
  <aside>
    <header class="masthead">
      <h1>Japón <em>en otoño</em></h1>
      <div class="meta">
        <span><strong>Marina</strong> & <strong>Jaime</strong></span>
        <span id="countdown" class="countdown"></span>
      </div>
    </header>

    <div class="summary">
      <div class="stat">
        <span class="stat-value" id="stat-nights">14</span>

  const LINES = {
    yamanote: { color: '#8FC31F', label: 'JY' },
    karasuma: { color: '#3CB371', label: 'K' },
    yurakucho: { color: '#BB8B38', label: 'Y' }

  function lineBadge(lineKey, code) {
    const l = LINES[lineKey];
    if (!l) return '';
    return `<span class="line-badge" style="background:${l.color}">${l.label}${code}</span>`;
  }

  // Renderiza una lista de opciones de transporte ordenadas de más rápida a
  // más lenta, con etiqueta verde en la más rápida y, justo debajo de ella
  // (posición 2), la más económica de entre las que tienen precio conocido
  // (solo si hay más de una opción).
  function renderOptions(options) {
    let sorted = [...options].sort((a, b) => a.timeMinutes - b.timeMinutes);
    const fastestOpt = sorted[0];
    const withPrice = sorted.filter(o => typeof o.priceValue === 'number');
    const cheapestOpt = withPrice.length
      ? withPrice.reduce((min, o) => o.priceValue < min.priceValue ? o : min)
      : null;
    if (cheapestOpt && cheapestOpt !== fastestOpt) {
      sorted = sorted.filter(o => o !== cheapestOpt);
      sorted.splice(1, 0, cheapestOpt);
    }
    return sorted.map((o) => {
      const badges = [];
      if (sorted.length > 1 && o === fastestOpt) badges.push('La más rápida');
      if (sorted.length > 1 && o === cheapestOpt) badges.push('La más económica');
      const badgeHtml = badges.map(b => `<span class="rm-fastest-badge">${b}</span>`).join('');
      const body = o.steps
        ? `<ul class="rm-steps">${o.steps.map(s => `
            <li class="rm-step">
              <span class="rm-step-icon">${s.icon}</span>
              <span class="rm-step-desc">${s.desc}</span>
              ${s.time ? `<span class="rm-step-time">${s.time}</span>` : ''}
            </li>`).join('')}</ul>`
        : `<div class="rm-option-desc">${o.desc}</div>`;
      const price = o.price ? `<div class="rm-option-price">${o.price}</div>` : '';
      const note = o.note ? `<div class="rm-option-note">${o.note}</div>` : '';
      return `
        <div class="rm-option">
          <div class="rm-option-head">
            <span class="rm-option-icon">${o.icon}</span>
            <span class="rm-option-title">${o.title}</span>
            ${badgeHtml}
            <span class="rm-option-time">${o.time}</span>
          </div>
          ${body}
          ${price}
          ${note}
        </div>
      `;
    }).join('');
  }

  function buildRouteHtml(fromPlace, leg) {
    const walkHtml = fromPlace.toTransport

    const hasRoute = !!(fromPlace.toTransport || (leg && leg.options));
    const optionsHtml = leg && leg.options ? renderOptions(leg.options) : '';

    const routeToggleBtn = hasRoute ? `<button type="button" class="rm-toggle-btn" aria-expanded="false">Ver recorrido</button>` : '';

function initMap() {

  const map = new google.maps.Map(document.getElementById('map'), {
    center: { lat: 36.2, lng: 137.5 },
    zoom: 6,
    mapId: 'DEMO_MAP_ID',
    zoomControl: true,
    streetViewControl: false,
    mapTypeControl: false,
    fullscreenControl: false
  });

  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);

  // En iPhone, los enlaces https://www.google.com/maps abren primero Safari.
  // Si tienen la app de Google Maps instalada, probamos el esquema
  // comgooglemaps:// (abre la app directamente) y si no reacciona
  // (no está instalada), caemos al enlace web normal.
  function attachSmartMapsClick(el, appUrl, webUrl) {
    if (!isIOS) return;
    el.addEventListener('click', (e) => {
      e.preventDefault();
      let opened = false;
      const onHide = () => { opened = true; };
      document.addEventListener('visibilitychange', onHide, { once: true });
      window.location.href = appUrl;
      setTimeout(() => {
        document.removeEventListener('visibilitychange', onHide);
        if (!opened) window.open(webUrl, '_blank', 'noopener');
      }, 1000);
    });
  }

  function statusBadgeHtml(place) {
    return place.partial
      ? `<span class="booked partial">parcial</span>`
      : place.booked
        ? `<span class="booked">reservado</span>`
        : `<span class="booked pending">pendiente</span>`;
  }

  function bookingButtonsHtml(place) {
    return place.bookings
      ? place.bookings.map(b => {
          const href = b.voucher || b.url;
          return href
            ? `<a href="${href.replace(/&/g, '&amp;')}" target="_blank" rel="noopener" class="info-cta">${b.label}</a>`
            : `<span class="info-cta info-cta-disabled">${b.label}</span>`;
        }).join('')
      : (() => {
          const href = place.voucher || place.bookingUrl;
          return href
            ? `<a href="${href.replace(/&/g, '&amp;')}" target="_blank" rel="noopener" class="info-cta">${place.booked ? 'Ver reserva' : 'Ver hotel'}</a>`
            : '';
        })();
  }

  const overlay = document.getElementById('info-overlay');
  const overlayContent = document.getElementById('info-content');
  let hideTimer = null;
  let pinned = false;

  function showInfo(place, isOptional, pin, extended) {
    clearTimeout(hideTimer);
    if (pin) pinned = true;
    const statusTag = place.partial ? ' · reserva parcial' : (place.booked ? ' · reservado' : '');
    const eyebrow = isOptional
      ? `Excursión de día`
      : `Parada ${place.n} de ${stops.length}${statusTag}`;
    const meta = isOptional
      ? `${place.tag || 'Excursión de día'}`
      : `${place.dates}  ·  ${place.nights} ${place.nights === 1 ? 'noche' : 'noches'}`;
    const bookingCta = bookingButtonsHtml(place);
    const directionsCta = place.address
      ? `<a href="https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(place.address)}" target="_blank" rel="noopener" class="info-cta" data-directions="1">Cómo llegar</a>`
      : '';

    // Cada bloque de contenido pasa a ser una pestaña independiente.
    const tabs = [];

    // Pestaña "Del aeropuerto al hotel" / "Cómo llegar desde X" (excursiones)
    if (place.arrivalOptions) {
      const arrivalDirectionsCta = (place.arrivalOrigin && place.address)
        ? `<a href="https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(place.arrivalOrigin)}&destination=${encodeURIComponent(place.address)}&travelmode=transit" target="_blank" rel="noopener" class="info-cta" data-arrival-directions="1">Cómo llegar</a>`
        : '';
      tabs.push({
        label: place.arrivalLabel || 'Cómo llegar',
        html: `
          <div class="rm-btn-row">
            <button type="button" class="rm-toggle-btn" aria-expanded="false">Ver recorrido</button>
            ${arrivalDirectionsCta}
          </div>
          <div class="rm-collapsible" hidden>
            ${renderOptions(place.arrivalOptions)}
          </div>
        `
      });
    }

    // Pestaña "¿Cómo llegar?" (a partir de la 2ª parada): el mismo trayecto
    // que ya se muestra en la pestaña de la parada anterior (con el nombre
    // de esta parada), para poder verlo también desde aquí.
    if (!isOptional && !place.arrivalOptions) {
      const idx = stops.indexOf(place);
      const prev = stops[idx - 1];
      if (prev) {
        const prevLeg = legByFrom[prev.n];
        const r = buildRouteHtml(prev, prevLeg);
        if (r.hasRoute) {
          const originParam = prev.address || `${prev.lat},${prev.lng}`;
          const destParam = place.address || `${place.lat},${place.lng}`;
          const webUrl = `https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(originParam)}&destination=${encodeURIComponent(destParam)}&travelmode=transit`;
          tabs.push({
            label: '¿Cómo llegar?',
            html: `
              ${r.summaryHtml}
              <div class="rm-btn-row">
                ${r.routeToggleBtn}
                <a href="${webUrl}" target="_blank" rel="noopener" class="info-cta" data-incoming-directions="1">Cómo llegar</a>
              </div>
              ${r.routeCollapsible}
            `
          });
        }
      }
    }

    // Pestaña "¿Qué hacer?"
    tabs.push({
      label: '¿Qué hacer?',
      html: `<ul class="info-todo">${place.todo.map(t => `<li>${t}</li>`).join('')}</ul>`
    });

    // Pestaña "Alojamiento": reserva + cómo llegar al propio hotel de esta parada.
    if (bookingCta || directionsCta) {
      tabs.push({
        label: 'Alojamiento',
        html: `<div class="info-cta-row">${bookingCta}${directionsCta}</div>`
      });
    }

    // Pestaña con el nombre de la siguiente parada ("Preparar para X"), o
    // "Vuelta a casa" si es la última. Va siempre la última. No aplica a
    // excursiones de día.
    if (!isOptional) {
      const idx = stops.indexOf(place);
      const next = stops[idx + 1];
      const leg = legByFrom[place.n];
      const r = buildRouteHtml(place, leg);

      if (next) {
        const originParam = place.address || `${place.lat},${place.lng}`;
        const destParam = next.address || `${next.lat},${next.lng}`;
        const webUrl = `https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(originParam)}&destination=${encodeURIComponent(destParam)}&travelmode=transit`;
        tabs.push({
          label: next.name,
          html: `
            ${r.summaryHtml}
            <div class="rm-btn-row">
              ${r.routeToggleBtn}
              <a href="${webUrl}" target="_blank" rel="noopener" class="info-cta" data-rm-directions="1">Cómo llegar</a>
            </div>
            ${r.routeCollapsible}
            <div class="rm-next-hotel">
              <span class="rm-label-inline">Alojamiento en ${next.name}:</span> ${next.hotel}
            </div>
            <div class="info-cta-row">${bookingButtonsHtml(next)}</div>
          `
        });
      } else {
        tabs.push({
          label: 'Vuelta a casa',
          html: `
            <div class="rm-btn-row">${r.routeToggleBtn}</div>
            ${r.routeCollapsible}
            <div class="rm-transport">Vuelo de salida: 17 oct 2026, 11:10 desde Narita (NRT). Ruta hotel → aeropuerto pendiente de confirmar.</div>
          `
        });
      }
    }

    // Ninguna pestaña se abre por defecto: el usuario elige cuál ver.
    const tabsHtml = `
      <div class="rm-tabs">
        ${tabs.map((t, i) => `<button type="button" class="rm-tab-btn" data-tab="${i}">${t.label}</button>`).join('')}
      </div>
    `;
    const panelsHtml = tabs.map((t, i) => `<div class="rm-tab-panel" data-tab-panel="${i}" hidden>${t.html}</div>`).join('');

    overlayContent.innerHTML = `
      <button class="info-close" aria-label="Cerrar">×</button>
      <div class="info-eyebrow">${eyebrow}</div>
      <div class="info-title">${place.name}</div>
      <div class="info-dates">${meta}</div>
      ${tabsHtml}
      ${panelsHtml}
    `;
    overlayContent.querySelectorAll('.rm-tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        overlayContent.querySelectorAll('.rm-tab-btn').forEach(b => b.classList.toggle('active', b === btn));
        overlayContent.querySelectorAll('.rm-tab-panel').forEach(p => {
          p.hidden = p.dataset.tabPanel !== btn.dataset.tab;
        });
      });
    });
    overlayContent.querySelector('.info-close').addEventListener('click', closeInfo);
    const dirLink = overlayContent.querySelector('[data-directions]');
    if (dirLink) {
      attachSmartMapsClick(
        dirLink,
        `comgooglemaps://?daddr=${encodeURIComponent(place.address)}`,
        dirLink.href
      );
    }
    const arrivalDirLink = overlayContent.querySelector('[data-arrival-directions]');
    if (arrivalDirLink) {
      attachSmartMapsClick(
        arrivalDirLink,
        `comgooglemaps://?saddr=${encodeURIComponent(place.arrivalOrigin)}&daddr=${encodeURIComponent(place.address)}&directionsmode=transit`,
        arrivalDirLink.href
      );
    }
    const nextDirLink = overlayContent.querySelector('[data-rm-directions]');
    if (nextDirLink) {
      const idx = stops.indexOf(place);
      const next = stops[idx + 1];
      const originParam = place.address || `${place.lat},${place.lng}`;
      const destParam = next.address || `${next.lat},${next.lng}`;
      attachSmartMapsClick(
        nextDirLink,
        `comgooglemaps://?saddr=${encodeURIComponent(originParam)}&daddr=${encodeURIComponent(destParam)}&directionsmode=transit`,
        nextDirLink.href
      );
    }
    const incomingDirLink = overlayContent.querySelector('[data-incoming-directions]');
    if (incomingDirLink) {
      const idx = stops.indexOf(place);
      const prev = stops[idx - 1];
      const originParam = prev.address || `${prev.lat},${prev.lng}`;
      const destParam = place.address || `${place.lat},${place.lng}`;
      attachSmartMapsClick(
        incomingDirLink,
        `comgooglemaps://?saddr=${encodeURIComponent(originParam)}&daddr=${encodeURIComponent(destParam)}&directionsmode=transit`,
        incomingDirLink.href
      );
    }
    overlayContent.querySelectorAll('.rm-toggle-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const row = btn.closest('.rm-btn-row');
        const target = (row || btn).nextElementSibling;
        const expanded = btn.getAttribute('aria-expanded') === 'true';
        target.hidden = expanded;
        btn.setAttribute('aria-expanded', String(!expanded));
        btn.textContent = expanded ? 'Ver recorrido' : 'Ocultar recorrido';
      });
    });
    overlay.classList.add('visible');
  }

  overlay.addEventListener('mouseenter', () => clearTimeout(hideTimer));
  overlay.addEventListener('mouseleave', () => hideInfo(false));
  overlay.addEventListener('click', (e) => { if (e.target === overlay) closeInfo(); });

  function hideInfo(immediate) {
    if (pinned && !immediate) return;
    clearTimeout(hideTimer);
    if (immediate) {
      overlay.classList.remove('visible');
    } else {
      hideTimer = setTimeout(() => overlay.classList.remove('visible'), 220);
    }
  }

  function closeInfo() {
    pinned = false;
    hideInfo(true);
  }

  function showConverter() {
    clearTimeout(hideTimer);
    pinned = true;
    const cachedRate = parseFloat(localStorage.getItem('jpyEurRate')) || 178;
    const cachedDate = localStorage.getItem('jpyEurRateDate');
    overlayContent.innerHTML = `
      <button class="info-close" aria-label="Cerrar">×</button>
      <div class="info-eyebrow">Herramienta</div>
      <div class="info-title">Conversor ¥ ↔ €</div>
      <div class="converter-fields" style="margin-top:24px">
        <div class="converter-field">
          <label for="conv-jpy">YENES (¥)</label>
          <input type="number" inputmode="decimal" id="conv-jpy" placeholder="0" />
        </div>
        <div class="converter-swap">=</div>
        <div class="converter-field">
          <label for="conv-eur">EUROS (€)</label>
          <input type="number" inputmode="decimal" id="conv-eur" placeholder="0" />
        </div>
      </div>
      <div class="converter-rate">
        Tipo de cambio: 1 € = <span id="conv-rate">${cachedRate}</span> ¥
      </div>
      <div class="converter-status" id="conv-status">${cachedDate ? `Último tipo real conocido: ${cachedDate}. Buscando uno actualizado…` : 'Buscando el tipo de cambio real…'}</div>
    `;
    overlayContent.querySelector('.info-close').addEventListener('click', closeInfo);

    const jpyEl = overlayContent.querySelector('#conv-jpy');
    const eurEl = overlayContent.querySelector('#conv-eur');
    const rateEl = overlayContent.querySelector('#conv-rate');
    const statusEl = overlayContent.querySelector('#conv-status');
    let currentRate = cachedRate;

    function recompute() {
      if (jpyEl.value) {
        eurEl.value = (parseFloat(jpyEl.value) / currentRate).toFixed(2);
      } else if (eurEl.value) {
        jpyEl.value = Math.round(parseFloat(eurEl.value) * currentRate);
      }
    }

    jpyEl.addEventListener('input', () => {
      const jpy = parseFloat(jpyEl.value);
      eurEl.value = isNaN(jpy) ? '' : (jpy / currentRate).toFixed(2);
    });
    eurEl.addEventListener('input', () => {
      const eur = parseFloat(eurEl.value);
      jpyEl.value = isNaN(eur) ? '' : Math.round(eur * currentRate);
    });

    fetch('https://api.frankfurter.dev/v1/latest?from=EUR&to=JPY')
      .then(r => r.json())
      .then(data => {
        const liveRate = data && data.rates && data.rates.JPY;
        if (!liveRate) throw new Error('sin dato');
        localStorage.setItem('jpyEurRate', liveRate);
        localStorage.setItem('jpyEurRateDate', data.date);
        currentRate = liveRate;
        rateEl.textContent = liveRate.toFixed(2);
        statusEl.textContent = `Tipo de cambio real del ${data.date} (Banco Central Europeo).`;
        recompute();
      })
      .catch(() => {
        statusEl.textContent = cachedDate
          ? `No se pudo actualizar. Usando el último tipo real conocido (${cachedDate}).`
          : 'No se pudo obtener el tipo de cambio real — inténtalo con conexión.';
      });

    overlay.classList.add('visible');
  }
  document.getElementById('converter-btn').addEventListener('click', showConverter);

  function showTransporte() {
    clearTimeout(hideTimer);
    pinned = true;
    overlayContent.innerHTML = `
      <button class="info-close" aria-label="Cerrar">×</button>
      <div class="info-eyebrow">Herramienta</div>
      <div class="info-title">Transporte</div>
      <div class="info-cta-row" style="margin-top:24px">
        <a href="transporte/jr-pass-mapa-validez.pdf" target="_blank" rel="noopener" class="info-cta">Guía 1</a>
        <a href="transporte/jr-pass-mapa-nacional-en.pdf" target="_blank" rel="noopener" class="info-cta">Guía 2</a>
        <a href="transporte/mapa-shinkansen-2026.png" target="_blank" rel="noopener" class="info-cta">Guía 3</a>
      </div>
    `;
    overlayContent.querySelector('.info-close').addEventListener('click', closeInfo);
    overlay.classList.add('visible');
  }
  document.getElementById('transporte-btn').addEventListener('click', showTransporte);

  // Sitios para comer por ciudad. Cada sitio: { name: "...", url: "enlace de Google Maps" }
  const GASTRONOMIA = [
    { city: 'Tokio', places: [] },
    { city: 'Nara', places: [] },
    { city: 'Kioto', places: [] },
    { city: 'Osaka', places: [] }
  ];

  function showGastronomia() {
    clearTimeout(hideTimer);
    pinned = true;
    const tabsHtml = `
      <div class="rm-tabs">
        ${GASTRONOMIA.map((c, i) => `<button type="button" class="rm-tab-btn" data-tab="${i}">${c.city}</button>`).join('')}
      </div>`;
    const panelsHtml = GASTRONOMIA.map((c, i) => {
      const body = c.places.length
        ? `<div class="info-cta-row">${c.places.map(p => `<a href="${p.url.replace(/&/g, '&amp;')}" target="_blank" rel="noopener" class="info-cta">${p.name}</a>`).join('')}</div>`
        : `<div class="info-eyebrow">Sin sitios todavía</div>`;
      return `<div class="rm-tab-panel" data-tab-panel="${i}" hidden>${body}</div>`;
    }).join('');
    overlayContent.innerHTML = `
      <button class="info-close" aria-label="Cerrar">×</button>
      <div class="info-eyebrow">Herramienta</div>
      <div class="info-title">Gastronomía</div>
      ${tabsHtml}
      ${panelsHtml}
    `;
    overlayContent.querySelectorAll('.rm-tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        overlayContent.querySelectorAll('.rm-tab-btn').forEach(b => b.classList.toggle('active', b === btn));
        overlayContent.querySelectorAll('.rm-tab-panel').forEach(p => {
          p.hidden = p.dataset.tabPanel !== btn.dataset.tab;
        });
      });
    });
    overlayContent.querySelector('.info-close').addEventListener('click', closeInfo);
    overlay.classList.add('visible');
  }
  document.getElementById('gastronomia-btn').addEventListener('click', showGastronomia);

  const markerMap = {};
  const stopEls = {};

  stops.forEach((s, i) => {
    const pinEl = document.createElement('div');
    pinEl.className = 'marker-pin';
    pinEl.dataset.n = s.n;
    pinEl.textContent = s.n;
    const m = new google.maps.marker.AdvancedMarkerElement({
      map, position: { lat: s.lat, lng: s.lng }, content: pinEl
    });
    pinEl.addEventListener('mouseenter', () => showInfo(s, false));
    pinEl.addEventListener('mouseleave', () => hideInfo(false));
    pinEl.addEventListener('click', () => { focusStop(i); showInfo(s, false, true); });
    markerMap[i] = m;
  });

  optionalStops.forEach(o => {
    const pinEl = document.createElement('div');
    pinEl.className = 'marker-pin optional';
    pinEl.textContent = o.label;
    new google.maps.marker.AdvancedMarkerElement({
      map, position: { lat: o.lat, lng: o.lng }, content: pinEl
    });
    pinEl.addEventListener('mouseenter', () => showInfo(o, true));
    pinEl.addEventListener('mouseleave', () => hideInfo(false));
    pinEl.addEventListener('click', () => showInfo(o, true, true));
  });

  const dashSymbol = { path: 'M 0,-1 0,1', strokeOpacity: 1, scale: 3 };
  new google.maps.Polyline({
    path: stops.map(s => ({ lat: s.lat, lng: s.lng })),
    strokeOpacity: 0,
    strokeColor: '#C84A28',
    icons: [{ icon: dashSymbol, offset: '0', repeat: '14px' }],
    map
  });

  const tl = document.getElementById('timeline');
  const legByFrom = {};
  legs.forEach(l => legByFrom[l.from] = l);

  // Calcula qué parada toca hoy para marcarla en la lista lateral
  const todayCalcStart = new Date('2026-10-03T00:00:00+09:00');
  let todayStopIndex = -1;
  const nowJst = new Date();
  if (nowJst >= todayCalcStart) {
    let cursor = new Date(todayCalcStart);
    for (let idx = 0; idx < stops.length; idx++) {
      const endCursor = new Date(cursor);
      endCursor.setDate(endCursor.getDate() + stops[idx].nights);
      if (nowJst < endCursor) { todayStopIndex = idx; break; }
      cursor = endCursor;
    }
  }

  const sectionTitle = document.createElement('div');
  sectionTitle.className = 'section-title';
  sectionTitle.textContent = 'Ruta';
  tl.appendChild(sectionTitle);

  stops.forEach((s, i) => {
    const el = document.createElement('div');
    el.className = 'stop';
    el.dataset.i = i;
    const bookedBadge = statusBadgeHtml(s);
    const todayBadge = i === todayStopIndex ? '<span class="stop-today">Hoy</span>' : '';
    el.innerHTML = `
      <div class="stop-num">${String(s.n).padStart(2, '0')}</div>
      <div class="stop-body">
        <div class="stop-name">${s.name}${bookedBadge}${todayBadge}</div>
        <div class="stop-detail">${s.dates}</div>
      </div>
      <div class="stop-nights">
        <strong>${s.nights}</strong>
        <small>${s.nights === 1 ? 'noche' : 'noches'}</small>
      </div>
    `;
    el.addEventListener('click', () => { focusStop(i); showInfo(s, false, true); });
    tl.appendChild(el);
    stopEls[i] = el;
  });

  // Optional stops section
  const optSection = document.createElement('div');
  optSection.className = 'section-title';
  optSection.textContent = 'Excursiones de día';
  optSection.style.marginTop = '20px';
  tl.appendChild(optSection);

  optionalStops.forEach(o => {
    const el = document.createElement('div');
    el.className = 'stop optional';
    el.style.opacity = '0.75';
    el.innerHTML = `
      <div class="stop-num" style="font-style:italic">${o.label}</div>
      <div class="stop-body">
        <div class="stop-name" style="font-style:italic">${o.name}</div>
        <div class="stop-detail">${o.tag || 'Excursión de día'}</div>
      </div>
      <div class="stop-nights">
        <strong style="color:var(--muted);font-style:italic">?</strong>
      </div>
    `;
    el.addEventListener('click', () => showInfo(o, true, true));
    tl.appendChild(el);
  });

  let currentIndex = 0;

  function focusStop(i) {
    currentIndex = i;
    Object.values(stopEls).forEach(el => el.classList.remove('active'));
    stopEls[i].classList.add('active');
    document.querySelectorAll('.marker-pin').forEach(el => el.classList.remove('active'));
    const s = stops[i];
    map.panTo({ lat: s.lat, lng: s.lng });
    map.setZoom(10);
    setTimeout(() => {
      const pin = document.querySelector(`.marker-pin[data-n="${s.n}"]`);
      if (pin) pin.classList.add('active');
    }, 100);
    stopEls[i].scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
      e.preventDefault();
      focusStop(Math.min(currentIndex + 1, stops.length - 1));
    } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
      e.preventDefault();
      focusStop(Math.max(currentIndex - 1, 0));
    } else if (e.key === 'Escape') {
      closeInfo();
    }
    checkKonami(e.key);
  });

  // Easter egg: código Konami → fuegos artificiales (hanabi)
  const konamiCode = ['ArrowUp', 'ArrowUp', 'ArrowDown', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'ArrowLeft', 'ArrowRight', 'b', 'a'];
  let konamiIndex = 0;
  function checkKonami(key) {
    const expected = konamiCode[konamiIndex];
    const match = expected.length === 1 ? key.toLowerCase() === expected : key === expected;
    if (match) {
      konamiIndex++;
      if (konamiIndex === konamiCode.length) {
        konamiIndex = 0;
        triggerFireworks();
      }
    } else {
      konamiIndex = (key === konamiCode[0]) ? 1 : 0;
    }
  }

  function spawnFirework(x, y) {
    const colors = ['#C84A28', '#5E6B3D', '#1B1F2A', '#D4AF37'];
    for (let i = 0; i < 24; i++) {
      const p = document.createElement('div');
      p.className = 'firework-particle';
      const angle = (i / 24) * 2 * Math.PI;
      const dist = 60 + Math.random() * 80;
      p.style.left = x + 'px';
      p.style.top = y + 'px';
      p.style.background = colors[Math.floor(Math.random() * colors.length)];
      p.style.setProperty('--dx', Math.cos(angle) * dist + 'px');
      p.style.setProperty('--dy', Math.sin(angle) * dist + 'px');
      document.body.appendChild(p);
      setTimeout(() => p.remove(), 1000);
    }
  }

  function triggerFireworks() {
    for (let b = 0; b < 4; b++) {
      setTimeout(() => {
        const x = 100 + Math.random() * (window.innerWidth - 200);
        const y = 100 + Math.random() * (window.innerHeight * 0.5);
        spawnFirework(x, y);
      }, b * 300);
    }
  }

  document.getElementById('lastupdate').textContent = new Date().toLocaleDateString('es-ES', { day: '2-digit', month: 'short', year: 'numeric' }).toLowerCase();
  document.getElementById('stat-booked').textContent = stops.filter(s => s.booked).length;
  document.getElementById('stat-bases').textContent = stops.length;
  document.getElementById('stat-nights').textContent = stops.reduce((a, s) => a + s.nights, 0);

  // Cuenta atrás hasta el viaje
  const tripStart = new Date('2026-10-03T00:00:00+09:00');
  const tripEnd = new Date('2026-10-17T23:59:59+09:00');
  const now = new Date();
  const countdownEl = document.getElementById('countdown');
  if (now < tripStart) {
    const days = Math.ceil((tripStart - now) / 86400000);
    countdownEl.textContent = `Faltan ${days} días`;
  } else if (now <= tripEnd) {
    const dayNum = Math.floor((now - tripStart) / 86400000) + 1;
    countdownEl.textContent = `Día ${dayNum} de 15 · ¡en Japón!`;
  } else {
    countdownEl.textContent = `Viaje completado`;
  }

}
</script>

</body>
</html>
